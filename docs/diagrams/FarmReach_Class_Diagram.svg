<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1230" viewBox="0 0 2200 1230" role="img" aria-labelledby="ctitle cdesc"><title id="ctitle">FarmReach Cloud Class Diagram</title><desc id="cdesc">Verified Laravel model classes and migration-supported associations.</desc><style>text{font-family:Georgia,'Times New Roman',serif;fill:#111827}.heading{font-size:21px;font-weight:bold;fill:#172b4d}.classname{font-size:19px;font-weight:bold}.stereo{font-size:10px;font-style:italic;fill:#334155}.section{font-size:15px;font-weight:bold}.row{font-size:15px}.classbox{fill:#fff;stroke:#263746;stroke-width:1.8}.classhead{fill:#dbeafe;stroke:#263746;stroke-width:1.8}.divider{stroke:#263746;stroke-width:1.5}.relation{fill:none;stroke:#263746;stroke-width:1.5}.rel-label{font-size:11px;fill:#172b4d;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.multiplicity{font-size:13px;font-weight:bold;fill:#172b4d;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.note{font-size:13px;fill:#334155}</style><rect width="2200" height="1230" fill="#fff"/><text x="1100" y="34" text-anchor="middle" class="heading">FarmReach Cloud: A SaaS-Driven Agricultural Marketplace and Order Management System.</text><text x="1100" y="73" text-anchor="middle" class="heading">CLASS DIAGRAM</text><polyline points="520,245 600,245" class="relation"/><text x="560" y="238" text-anchor="middle" class="rel-label">activityLogs</text><text x="523" y="225" class="multiplicity">0..1</text><text x="570" y="225" class="multiplicity">0..*</text><polyline points="400,380 400,410 1375,410 1375,380" class="relation"/><text x="880" y="402" text-anchor="middle" class="rel-label">author / user_id</text><text x="410" y="388" class="multiplicity">1</text><text x="1375" y="388" class="multiplicity">0..*</text><polyline points="470,380 470,425 1925,425 1925,380" class="relation"/><text x="1380" y="417" text-anchor="middle" class="rel-label">Notifiable morph (trait; no FK)</text><text x="470" y="398" class="multiplicity">1</text><text x="1925" y="398" class="multiplicity">0..*</text><polyline points="295,380 295,450" class="relation"/><text x="300" y="418" text-anchor="middle" class="rel-label">farmer / user_id</text><text x="295" y="382" class="multiplicity">1</text><text x="305" y="437" class="multiplicity">0..*</text><polyline points="70,315 35,315 35,870 70,870" class="relation"/><text x="45" y="590" text-anchor="middle" class="rel-label">buyer_id</text><text x="25" y="295" class="multiplicity">1</text><text x="25" y="850" class="multiplicity">0..*</text><polyline points="520,325 555,325 555,740 420,740 420,790" class="relation"/><text x="560" y="560" text-anchor="middle" class="rel-label">farmer_id</text><text x="525" y="307" class="multiplicity">1</text><text x="420" y="770" class="multiplicity">0..*</text><polyline points="520,570 600,570" class="relation"/><text x="560" y="562" text-anchor="middle" class="rel-label">category_id (nullable)</text><text x="525" y="550" class="multiplicity">0..*</text><text x="570" y="550" class="multiplicity">0..1</text><polyline points="410,750 555,770 555,885 600,885" class="relation"/><text x="558" y="822" text-anchor="middle" class="rel-label">product_id</text><text x="414" y="755" class="multiplicity">1</text><text x="565" y="885" class="multiplicity">0..*</text><polyline points="520,910 600,910" class="relation"/><text x="560" y="903" text-anchor="middle" class="rel-label">order_id</text><text x="523" y="910" class="multiplicity">1</text><text x="565" y="910" class="multiplicity">0..*</text><polyline points="440,1150 440,1160 1650,1160 1650,920 1600,920" class="relation"/><text x="1120" y="1185" text-anchor="middle" class="rel-label">order_id (schema FK; model hasOne)</text><text x="445" y="1148" class="multiplicity">1</text><text x="1601" y="900" class="multiplicity">0..*</text><polyline points="800,710 800,750 1660,750 1660,650 1700,650" class="relation"/><text x="1450" y="710" text-anchor="middle" class="rel-label">category_id (nullable)</text><text x="805" y="710" class="multiplicity">0..1</text><text x="1670" y="650" class="multiplicity">0..*</text><polyline points="1600,580 1700,580" class="relation"/><text x="1649" y="572" text-anchor="middle" class="rel-label">recipe_id</text><text x="1603" y="560" class="multiplicity">1</text><text x="1705" y="560" class="multiplicity">0..*</text><g id="card_user"><rect x="70" y="130" width="450" height="250" class="classbox"/><rect x="70" y="130" width="450" height="36" class="classhead"/><text x="295" y="155" text-anchor="middle" class="classname">User</text><text x="295" y="180" text-anchor="middle" class="stereo">&lt;&lt;Eloquent Model; roles are values&gt;&gt;</text><text x="82" y="205" class="section">Attributes</text><text x="82" y="224" class="row">+ id: bigint {PK}</text><text x="82" y="244" class="row">+ name, email: varchar</text><text x="82" y="264" class="row">+ phone_number?: varchar</text><text x="82" y="284" class="row">+ role: enum {admin|farmer|buyer}</text><text x="82" y="304" class="row">+ birthday?: date</text><text x="82" y="324" class="row">+ address?, bio?: text</text><line x1="70" y1="332" x2="520" y2="332" class="divider"/><text x="82" y="350" class="section">Methods</text><text x="82" y="373" class="row">+ isAdmin(), isFarmer(), isBuyer(): bool</text></g><g id="card_activity"><rect x="600" y="130" width="450" height="260" class="classbox"/><rect x="600" y="130" width="450" height="36" class="classhead"/><text x="825" y="155" text-anchor="middle" class="classname">ActivityLog</text><text x="825" y="180" text-anchor="middle" class="stereo">&lt;&lt;Eloquent Model&gt;&gt;</text><text x="612" y="205" class="section">Attributes</text><text x="612" y="224" class="row">+ id: bigint {PK}</text><text x="612" y="244" class="row">+ user_id?: bigint {FK}</text><text x="612" y="264" class="row">+ action: varchar</text><text x="612" y="284" class="row">+ description?: text; ip_address?: varchar</text><text x="612" y="304" class="row">+ created_at, updated_at: timestamp</text><line x1="600" y1="312" x2="1050" y2="312" class="divider"/><text x="612" y="330" class="section">Methods</text><text x="612" y="353" class="row">+ user(): BelongsTo</text><text x="612" y="373" class="row">+ log(userId, action, description): self</text></g><g id="card_announcement"><rect x="1150" y="130" width="450" height="250" class="classbox"/><rect x="1150" y="130" width="450" height="36" class="classhead"/><text x="1375" y="155" text-anchor="middle" class="classname">Announcement</text><text x="1375" y="180" text-anchor="middle" class="stereo">&lt;&lt;Eloquent Model&gt;&gt;</text><text x="1162" y="205" class="section">Attributes</text><text x="1162" y="224" class="row">+ id: bigint {PK}</text><text x="1162" y="244" class="row">+ user_id: bigint {FK}</text><text x="1162" y="264" class="row">+ title, location?, event_date?: varchar</text><text x="1162" y="284" class="row">+ description: text</text><text x="1162" y="304" class="row">+ is_active: bool; low_stock_notified_at?: timestamp</text><text x="1162" y="324" class="row">+ timestamps</text><line x1="1150" y1="332" x2="1600" y2="332" class="divider"/><text x="1162" y="350" class="section">Methods</text><text x="1162" y="373" class="row">+ author(): BelongsTo</text></g><g id="card_notification"><rect x="1700" y="130" width="450" height="250" class="classbox"/><rect x="1700" y="130" width="450" height="36" class="classhead"/><text x="1925" y="155" text-anchor="middle" class="classname">DatabaseNotification</text><text x="1925" y="180" text-anchor="middle" class="stereo">&lt;&lt;Laravel framework model; notifications table&gt;&gt;</text><text x="1712" y="205" class="section">Attributes</text><text x="1712" y="224" class="row">+ id: uuid {PK}</text><text x="1712" y="244" class="row">+ notifiable_type: varchar</text><text x="1712" y="264" class="row">+ notifiable_id: bigint {morph}</text><text x="1712" y="284" class="row">+ type: varchar; data: text</text><text x="1712" y="304" class="row">+ read_at?: timestamp; timestamps</text><line x1="1700" y1="312" x2="2150" y2="312" class="divider"/><text x="1712" y="330" class="section">Methods</text><text x="1712" y="353" class="row">+ markAsRead(): void</text></g><g id="card_product"><rect x="70" y="450" width="450" height="300" class="classbox"/><rect x="70" y="450" width="450" height="36" class="classhead"/><text x="295" y="475" text-anchor="middle" class="classname">Product</text><text x="295" y="500" text-anchor="middle" class="stereo">&lt;&lt;Eloquent Model&gt;&gt;</text><text x="82" y="525" class="section">Attributes</text><text x="82" y="544" class="row">+ id: bigint {PK}</text><text x="82" y="564" class="row">+ user_id: bigint {FK}</text><text x="82" y="584" class="row">+ category_id?: bigint {FK}</text><text x="82" y="604" class="row">+ name: varchar</text><text x="82" y="624" class="row">+ price: decimal(10,2); quantity: int</text><text x="82" y="644" class="row">+ kilograms?: decimal(8,2); unit: varchar</text><text x="82" y="664" class="row">+ is_active: bool; low_stock_notified_at?: timestamp</text><line x1="70" y1="672" x2="520" y2="672" class="divider"/><text x="82" y="690" class="section">Methods</text><text x="82" y="713" class="row">+ farmer(), category(): BelongsTo</text><text x="82" y="733" class="row">+ orderItems(): HasMany</text></g><g id="card_category"><rect x="600" y="450" width="450" height="260" class="classbox"/><rect x="600" y="450" width="450" height="36" class="classhead"/><text x="825" y="475" text-anchor="middle" class="classname">Category</text><text x="825" y="500" text-anchor="middle" class="stereo">&lt;&lt;Eloquent Model&gt;&gt;</text><text x="612" y="525" class="section">Attributes</text><text x="612" y="544" class="row">+ id: bigint {PK}</text><text x="612" y="564" class="row">+ name: varchar</text><text x="612" y="584" class="row">+ slug: varchar {unique}</text><text x="612" y="604" class="row">+ icon?: varchar</text><text x="612" y="624" class="row">+ description?: text</text><text x="612" y="644" class="row">+ timestamps</text><line x1="600" y1="652" x2="1050" y2="652" class="divider"/><text x="612" y="670" class="section">Methods</text><text x="612" y="693" class="row">+ products(), recipeIngredients(): HasMany</text></g><g id="card_recipe"><rect x="1150" y="450" width="450" height="260" class="classbox"/><rect x="1150" y="450" width="450" height="36" class="classhead"/><text x="1375" y="475" text-anchor="middle" class="classname">Recipe</text><text x="1375" y="500" text-anchor="middle" class="stereo">&lt;&lt;Eloquent Model&gt;&gt;</text><text x="1162" y="525" class="section">Attributes</text><text x="1162" y="544" class="row">+ id: bigint {PK}</text><text x="1162" y="564" class="row">+ title, slug: varchar</text><text x="1162" y="584" class="row">+ description?: text</text><text x="1162" y="604" class="row">+ instructions?: longText</text><text x="1162" y="624" class="row">+ prep_time?, image_path?: varchar</text><text x="1162" y="644" class="row">+ timestamps</text><line x1="1150" y1="652" x2="1600" y2="652" class="divider"/><text x="1162" y="670" class="section">Methods</text><text x="1162" y="693" class="row">+ ingredients(): HasMany</text></g><g id="card_recipeIngredient"><rect x="1700" y="450" width="450" height="280" class="classbox"/><rect x="1700" y="450" width="450" height="36" class="classhead"/><text x="1925" y="475" text-anchor="middle" class="classname">RecipeIngredient</text><text x="1925" y="500" text-anchor="middle" class="stereo">&lt;&lt;Eloquent Model&gt;&gt;</text><text x="1712" y="525" class="section">Attributes</text><text x="1712" y="544" class="row">+ id: bigint {PK}</text><text x="1712" y="564" class="row">+ recipe_id: bigint {FK}</text><text x="1712" y="584" class="row">+ category_id?: bigint {FK}</text><text x="1712" y="604" class="row">+ name: varchar</text><text x="1712" y="624" class="row">+ quantity_description?: varchar</text><text x="1712" y="644" class="row">+ timestamps</text><line x1="1700" y1="652" x2="2150" y2="652" class="divider"/><text x="1712" y="670" class="section">Methods</text><text x="1712" y="693" class="row">+ recipe(), category(): BelongsTo</text><text x="1712" y="713" class="row">+ getAvailableProducts(): Collection</text></g><g id="card_order"><rect x="70" y="790" width="450" height="360" class="classbox"/><rect x="70" y="790" width="450" height="36" class="classhead"/><text x="295" y="815" text-anchor="middle" class="classname">Order</text><text x="295" y="840" text-anchor="middle" class="stereo">&lt;&lt;Eloquent Model&gt;&gt;</text><text x="82" y="865" class="section">Attributes</text><text x="82" y="884" class="row">+ id: bigint {PK}</text><text x="82" y="904" class="row">+ order_number: varchar {unique}</text><text x="82" y="924" class="row">+ buyer_id, farmer_id: bigint {FK}</text><text x="82" y="944" class="row">+ order_type: enum {standard|bulk}</text><text x="82" y="964" class="row">+ total_amount: decimal(10,2); shipping_fee: decimal(8,2)</text><text x="82" y="984" class="row">+ delivery_method: enum {deliver|pickup}</text><text x="82" y="1004" class="row">+ status: enum {pending|confirmed|delivered|</text><text x="82" y="1024" class="row">+ picked_up|cancelled}</text><text x="82" y="1044" class="row">+ notes?: text; timestamps</text><line x1="70" y1="1052" x2="520" y2="1052" class="divider"/><text x="82" y="1070" class="section">Methods</text><text x="82" y="1095" class="row">+ buyer(), farmer(): BelongsTo</text><text x="82" y="1115" class="row">+ items(): HasMany; payment(): HasOne</text><text x="82" y="1135" class="row">+ isBulk(): bool</text></g><g id="card_orderItem"><rect x="600" y="790" width="450" height="250" class="classbox"/><rect x="600" y="790" width="450" height="36" class="classhead"/><text x="825" y="815" text-anchor="middle" class="classname">OrderItem</text><text x="825" y="840" text-anchor="middle" class="stereo">&lt;&lt;Eloquent Model&gt;&gt;</text><text x="612" y="865" class="section">Attributes</text><text x="612" y="884" class="row">+ id: bigint {PK}</text><text x="612" y="904" class="row">+ order_id, product_id: bigint {FK}</text><text x="612" y="924" class="row">+ quantity: int</text><text x="612" y="944" class="row">+ unit_price, subtotal: decimal(10,2)</text><text x="612" y="964" class="row">+ timestamps</text><line x1="600" y1="972" x2="1050" y2="972" class="divider"/><text x="612" y="990" class="section">Methods</text><text x="612" y="1013" class="row">+ order(), product(): BelongsTo</text></g><g id="card_payment"><rect x="1150" y="790" width="450" height="260" class="classbox"/><rect x="1150" y="790" width="450" height="36" class="classhead"/><text x="1375" y="815" text-anchor="middle" class="classname">Payment</text><text x="1375" y="840" text-anchor="middle" class="stereo">&lt;&lt;Eloquent Model&gt;&gt;</text><text x="1162" y="865" class="section">Attributes</text><text x="1162" y="884" class="row">+ id: bigint {PK}</text><text x="1162" y="904" class="row">+ order_id: bigint {FK; not unique}</text><text x="1162" y="924" class="row">+ payment_method: enum {cod|bank_transfer|gcash}</text><text x="1162" y="944" class="row">+ payment_status: enum {pending|paid|failed}</text><text x="1162" y="964" class="row">+ reference_number?: varchar</text><text x="1162" y="984" class="row">+ amount: decimal; payment_date?: timestamp</text><line x1="1150" y1="992" x2="1600" y2="992" class="divider"/><text x="1162" y="1010" class="section">Methods</text><text x="1162" y="1033" class="row">+ order(): BelongsTo</text></g><text x="60" y="1202" class="note">Note: payments.order_id has no unique constraint (schema permits 0..* payments), while Order::payment() is hasOne. DatabaseNotification is Laravel framework-provided; User notifications use the Notifiable morph.</text></svg>