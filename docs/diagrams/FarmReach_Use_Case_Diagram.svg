<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">FarmReach Cloud Use Case Diagram</title><desc id="desc">Verified Buyer, Farmer, and Administrator use cases.</desc><style>text{font-family:Georgia,'Times New Roman',serif;fill:#111827}.title{font-size:25px;font-weight:700;fill:#172b4d}.system{fill:none;stroke:#2f5597;stroke-width:2.4;stroke-dasharray:10 7}.system-label{font-size:22px;font-weight:700;fill:#172b4d}.actor circle,.actor path{fill:none;stroke:#17202a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.actor-label{font-size:21px;font-weight:700}.association{fill:none;stroke:#263746;stroke-width:2}.usecase{fill:#eaf2fb;stroke:#2f5597;stroke-width:2.2}.usecase-label{font-size:18px}</style><rect width="1920" height="1080" fill="#fff"/><text x="960" y="48" text-anchor="middle" class="title">FarmReach Cloud: A SaaS-Driven Agricultural Marketplace and Order Management System.</text><rect x="190" y="125" width="1540" height="920" class="system"/><rect x="200" y="132" width="385" height="38" fill="#fff"/><text x="215" y="159" class="system-label">FarmReach Cloud System</text><polyline class="association" points="140,460 205,460 205,224 270,224"/><polyline class="association" points="140,460 205,460 205,364 270,364"/><polyline class="association" points="140,460 205,460 205,504 270,504"/><polyline class="association" points="140,460 205,460 205,644 270,644"/><polyline class="association" points="140,460 205,460 205,790 270,790"/><polyline class="association" points="1765,420 1700,420 1700,225 1620,225"/><polyline class="association" points="1765,420 1700,420 1700,384 1620,384"/><polyline class="association" points="1765,420 1700,420 1700,544 1620,544"/><polyline class="association" points="1765,825 1700,825 1700,684 1620,684"/><polyline class="association" points="1765,825 1700,825 1700,784 1620,784"/><polyline class="association" points="1765,825 1700,825 1700,884 1620,884"/><polyline class="association" points="1765,825 1700,825 1700,984 1620,984"/><g class="actor"><circle cx="85" cy="393" r="14"/><path d="M85 407V461M58 427L85 417L112 427M85 461L61 497M85 461L109 497"/><text x="85" y="526" text-anchor="middle" class="actor-label">Buyer</text></g><g class="actor"><circle cx="1825" cy="748" r="14"/><path d="M1825 762V816M1798 782L1825 772L1852 782M1825 816L1801 852M1825 816L1849 852"/><text x="1825" y="881" text-anchor="middle" class="actor-label">Farmer</text></g><g class="actor"><circle cx="1825" cy="338" r="14"/><path d="M1825 352V406M1798 372L1825 362L1852 372M1825 406L1801 442M1825 406L1849 442"/><text x="1825" y="471" text-anchor="middle" class="actor-label">Administrator</text></g><g id="uc_browse"><ellipse class="usecase" cx="475" cy="224" rx="205" ry="44"/><text x="475" y="224" text-anchor="middle" class="usecase-label">Browse and search agricultural products</text></g><g id="uc_compare"><ellipse class="usecase" cx="475" cy="364" rx="205" ry="44"/><text x="475" y="364" text-anchor="middle" class="usecase-label">Compare agricultural product prices</text></g><g id="uc_cart"><ellipse class="usecase" cx="475" cy="504" rx="205" ry="44"/><text x="475" y="504" text-anchor="middle" class="usecase-label">Manage shopping cart</text></g><g id="uc_place"><ellipse class="usecase" cx="475" cy="644" rx="205" ry="44"/><text x="475" y="644" text-anchor="middle" class="usecase-label">Place order; choose delivery or pickup</text></g><g id="uc_orders"><ellipse class="usecase" cx="475" cy="790" rx="205" ry="50"/><text x="475" y="778" text-anchor="middle" class="usecase-label">Review order history and status;</text><text x="475" y="802" text-anchor="middle" class="usecase-label">cancel pending orders or reorder</text></g><g id="uc_admin_dashboard"><ellipse class="usecase" cx="1405" cy="225" rx="215" ry="45"/><text x="1405" y="213" text-anchor="middle" class="usecase-label">View dashboard summaries and</text><text x="1405" y="237" text-anchor="middle" class="usecase-label">recent activity logs</text></g><g id="uc_admin_announcements"><ellipse class="usecase" cx="1405" cy="384" rx="215" ry="44"/><text x="1405" y="384" text-anchor="middle" class="usecase-label">Manage announcements</text></g><g id="uc_admin_recipes"><ellipse class="usecase" cx="1405" cy="544" rx="215" ry="44"/><text x="1405" y="544" text-anchor="middle" class="usecase-label">Browse, create, and delete recipes</text></g><g id="uc_farmer_products"><ellipse class="usecase" cx="1405" cy="684" rx="215" ry="44"/><text x="1405" y="684" text-anchor="middle" class="usecase-label">Manage product listings and stock</text></g><g id="uc_farmer_orders"><ellipse class="usecase" cx="1405" cy="784" rx="215" ry="44"/><text x="1405" y="784" text-anchor="middle" class="usecase-label">View incoming orders</text></g><g id="uc_farmer_update"><ellipse class="usecase" cx="1405" cy="884" rx="215" ry="44"/><text x="1405" y="884" text-anchor="middle" class="usecase-label">Update order status; set delivery fee</text></g><g id="uc_farmer_sales"><ellipse class="usecase" cx="1405" cy="984" rx="215" ry="44"/><text x="1405" y="984" text-anchor="middle" class="usecase-label">View sales history and summaries</text></g></svg>